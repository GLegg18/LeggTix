name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql:
    name: MySQL acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated MySQL tests
        shell: pwsh
        run: ./scripts/test.ps1 --display-warnings --fail-on-warning

  windows-wrapper:
    name: Windows wrapper (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check runner with Windows PowerShell
        if: ${{ matrix.shell == 'powershell' }}
        shell: powershell
        run: ./scripts/tests/Test-TestRunner.ps1
      - name: Check runner with PowerShell 7
        if: ${{ matrix.shell == 'pwsh' }}
        shell: pwsh
        run: ./scripts/tests/Test-TestRunner.ps1
