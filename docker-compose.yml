services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    command: sh -c "composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    command: php artisan queue:work redis --queue=emails --sleep=1 --tries=3 --timeout=30
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-leggtix}
      MYSQL_USER: ${DB_USERNAME:-leggtix}
      MYSQL_PASSWORD: ${DB_PASSWORD:-leggtix-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-leggtix-root-local}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_ALLOWED_HOSTS: localhost,127.0.0.1,mailpit
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
