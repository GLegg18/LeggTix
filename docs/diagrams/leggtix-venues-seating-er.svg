<text x="132" y="288" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">timezone</text>
<text x="132" y="316" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">capacity_ceiling?</text>
<rect x="656" y="164" width="464" height="216" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<path d="M 656 212 L 1120 212" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
<text x="672" y="196" fill="#1D4ED8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">events (extends MVP)</text>
<text x="672" y="232" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">PK</text>
<text x="708" y="232" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">id</text>
<text x="672" y="260" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">FK</text>
<text x="708" y="260" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">owner_id; event_type_id</text>
<text x="672" y="288" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">FK</text>
<text x="708" y="288" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">venue_id?</text>
<text x="708" y="316" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">capacity</text>
<text x="708" y="344" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">inventory_mode: GA | assigned</text>
<text x="708" y="372" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">sales_mode: free | paid</text>
<rect x="80" y="520" width="464" height="160" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<path d="M 80 568 L 544 568" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
<text x="96" y="552" fill="#1D4ED8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">venue_sections</text>
<text x="96" y="588" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">PK</text>
<text x="132" y="588" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">id</text>
