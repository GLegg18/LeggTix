<text x="132" y="996" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">venue_section_id</text>
<text x="132" y="1024" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">row_label; seat_label</text>
<text x="96" y="1052" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">UK</text>
<text x="132" y="1052" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">(venue_section_id, row_label, seat_label)</text>
<rect x="656" y="860" width="464" height="244" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<path d="M 656 908 L 1120 908" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
<text x="672" y="892" fill="#1D4ED8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">event_seats</text>
<text x="672" y="928" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">PK</text>
<text x="708" y="928" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">id</text>
<text x="672" y="956" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">FK</text>
<text x="708" y="956" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">event_id; venue_seat_id</text>
<text x="672" y="984" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">UK</text>
<text x="708" y="984" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">(event_id, venue_seat_id)</text>
<text x="708" y="1012" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">status: available | held | sold</text>
<text x="672" y="1040" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">FK</text>
<text x="708" y="1040" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">current_hold_id? -&gt; inventory_holds</text>
<text x="708" y="1068" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">version</text>
<text x="672" y="1096" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">FK</text>
<text x="708" y="1096" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">current_order_item_id? -&gt; order_items</text>
