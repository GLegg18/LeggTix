<text x="48" y="1292" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">PK primary key | FK foreign key | UK unique key | ? nullable | Key field subsets shown.</text>
<text x="48" y="1320" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">GA = general_admission; assigned = assigned_seating. Modes remain separate from free/paid.</text>
<text x="48" y="1348" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">Seat allocation locks the event first; current_hold_id + version guard expiry and payment retries.</text>
<text x="48" y="1376" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">Venue changes after sale require a separate policy; do not silently remap sold seat inventory.</text>
<rect x="396" y="96" width="413" height="28" rx="4" fill="#FFFFFF"/>
<text x="400" y="116" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">venue_id | event has 0..1 venue; venue has 0..* events</text>
<rect x="320" y="412" width="216" height="28" rx="4" fill="#FFFFFF"/>
<text x="324" y="432" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">venue_id | 1 -&gt; 0..* sections</text>
<rect x="320" y="784" width="256" height="28" rx="4" fill="#FFFFFF"/>
<text x="324" y="804" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">venue_section_id | 1 -&gt; 0..* seats</text>
<rect x="700" y="664" width="235" height="28" rx="4" fill="#FFFFFF"/>
<text x="704" y="684" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">event_id | 1 -&gt; 0..* event seats</text>
<rect x="348" y="1180" width="488" height="28" rx="4" fill="#FFFFFF"/>
<text x="352" y="1200" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">venue_seat_id | physical seat 1 -&gt; 0..* occurrence inventory rows</text>
</svg>
