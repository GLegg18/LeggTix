<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-label="Venues contain sections and physical seats. Events optionally reference a venue. Each event has occurrence-specific event seats referencing physical seats. Unique event and physical seat pairs protect inventory identity; current hold and sold order item links connect checkout.">
<title>PROPOSED EXTENSION: VENUES + ASSIGNED SEATING</title>
<desc>Venues contain sections and physical seats. Events optionally reference a venue. Each event has occurrence-specific event seats referencing physical seats. Unique event and physical seat pairs protect inventory identity; current hold and sold order item links connect checkout.</desc>
<rect x="0" y="0" width="1200" height="1440" fill="#FFFFFF"/>
<text x="48" y="64" fill="#1D4ED8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">PROPOSED EXTENSION: VENUES + ASSIGNED SEATING</text>
<text x="48" y="92" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">Each event is one occurrence; physical seats persist and inventory belongs to that occurrence.</text>
<rect x="80" y="164" width="464" height="160" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<path d="M 80 212 L 544 212" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
<text x="96" y="196" fill="#1D4ED8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">venues</text>
<text x="96" y="232" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">PK</text>
<text x="132" y="232" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">id</text>
