<text x="48" y="1416" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">PK primary key | FK foreign key | UK unique key | ? nullable | Key field subsets shown.</text>
<text x="48" y="1444" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">Team membership alone grants no event rights; membership + the specific event grant authorize access.</text>
<text x="48" y="1472" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">Owner/admin controls event grants. Optional user_roles replaces users.role after a deliberate backfill.</text>
<text x="48" y="1500" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">assigned_by is an optional audit FK to users; audit link omitted from relationship lines for readability.</text>
<rect x="440" y="96" width="311" height="28" rx="4" fill="#FFFFFF"/>
<text x="444" y="116" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">created_by | user 1 -&gt; 0..* created teams</text>
