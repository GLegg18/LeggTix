<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1560" viewBox="0 0 1200 1560" role="img" aria-label="Users own events and create teams. Team memberships connect users to teams; event team grants connect teams to individual event capabilities. An optional later roles and user_roles pair replaces users.role after backfill; it permits customer and organiser roles together.">
<title>PROPOSED EXTENSION: TEAMS + MULTIPLE USER ROLES</title>
<desc>Users own events and create teams. Team memberships connect users to teams; event team grants connect teams to individual event capabilities. An optional later roles and user_roles pair replaces users.role after backfill; it permits customer and organiser roles together.</desc>
<rect x="0" y="0" width="1200" height="1560" fill="#FFFFFF"/>
<text x="48" y="64" fill="#1D4ED8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">PROPOSED EXTENSION: TEAMS + MULTIPLE USER ROLES</text>
<text x="48" y="92" fill="#475569" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">Customer abilities stay shared; event access comes from ownership or scoped team grants.</text>
<rect x="80" y="164" width="464" height="104" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<path d="M 80 212 L 544 212" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
<text x="96" y="196" fill="#1D4ED8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">users (MVP)</text>
<text x="96" y="232" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">PK</text>
<text x="132" y="232" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">id</text>
<text x="132" y="260" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">role (current single-role field)</text>
<rect x="656" y="164" width="464" height="132" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<path d="M 656 212 L 1120 212" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
<text x="672" y="196" fill="#1D4ED8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">teams</text>
<text x="672" y="232" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">PK</text>
<text x="708" y="232" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">id</text>
<text x="708" y="260" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">name</text>
<text x="672" y="288" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">FK</text>
<text x="708" y="288" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">created_by -&gt; users.id</text>
<rect x="360" y="440" width="480" height="132" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<path d="M 360 488 L 840 488" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
<text x="376" y="472" fill="#1D4ED8" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">team_memberships</text>
<text x="376" y="508" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">PK</text>
<text x="412" y="508" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">(team_id, user_id)</text>
<text x="376" y="536" fill="#0F766E" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700">FK</text>
<text x="412" y="536" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">team_id; user_id</text>
<text x="412" y="564" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">team_role: manager | member</text>
<rect x="80" y="764" width="464" height="104" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<path d="M 80 812 L 544 812" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
