<text x="132" y="860" fill="#0F172A" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400">owner_id -&gt; users.id</text>
<rect x="656" y="764" width="464" height="188" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
<path d="M 656 812 L 1120 812" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
